- hosts: all
  become: true
  tasks:
    ############################################################
    # Skip this entire play in dry-run mode
    ############################################################
    - name: Skip browser installation in check mode
      ansible.builtin.meta: end_play
      when: ansible_check_mode


    ############################################################
    # Google Chrome (Direct .deb download and install)
    ############################################################
    - name: Check if Google Chrome is already installed
      ansible.builtin.stat:
        path: /usr/bin/google-chrome
      register: chrome_installed

    - name: Download Google Chrome stable .deb package
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        dest: /tmp/google-chrome-stable_current_amd64.deb
        mode: '0644'
      when: not chrome_installed.stat.exists

    - name: Install Google Chrome from .deb package
      ansible.builtin.apt:
        deb: /tmp/google-chrome-stable_current_amd64.deb
        state: present
      when: not chrome_installed.stat.exists


    ############################################################
    # Brave Browser
    ############################################################
    - name: Check if Brave is already installed
      ansible.builtin.shell: command -v brave-browser
      register: brave_installed
      changed_when: false
      failed_when: false

    - name: Ensure curl is installed (required for Brave official installer)
      ansible.builtin.apt:
        name: curl
        state: present
      when: brave_installed.rc != 0

    - name: Download Brave official keyring (dearmored)
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: '0644'
      when: brave_installed.rc != 0

    - name: Download Brave apt sources file (official)
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
        dest: /etc/apt/sources.list.d/brave-browser-release.sources
        mode: '0644'
      when: brave_installed.rc != 0

    - name: Update apt cache after adding Brave repo (force)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0
      when: brave_installed.rc != 0

    - name: Check Brave package availability
      ansible.builtin.shell: apt-cache policy brave-browser || true
      register: brave_policy
      changed_when: false
      failed_when: false
      when: brave_installed.rc != 0

    - name: Retry apt update if Brave package not found
      ansible.builtin.shell: |
        apt-get update -o Acquire::Retries=3
      register: apt_update_retry
      changed_when: false
      failed_when: false
      when:
        - brave_installed.rc != 0
        - "'Candidate: (none)' in brave_policy.stdout or 'Unable to locate package' in (brave_policy.stderr|default(''))"

    - name: Re-check Brave package availability after retry
      ansible.builtin.shell: apt-cache policy brave-browser || true
      register: brave_policy_retry
      changed_when: false
      failed_when: false
      when: apt_update_retry is defined

    - name: Fail if Brave package not available in apt after retry
      ansible.builtin.fail:
        msg: "Brave package not available in APT after retry. apt output:\n{{ brave_policy_retry.stdout | default(brave_policy.stdout) }}\napt stderr:\n{{ brave_policy_retry.stderr | default(brave_policy.stderr) }}"
      when:
        - brave_installed.rc != 0
        - >
          ('Candidate: (none)' in (brave_policy_retry.stdout | default(brave_policy.stdout))) or
          ('Unable to locate package' in (brave_policy_retry.stdout | default(brave_policy.stdout))) or
          ('Unable to locate package' in (brave_policy_retry.stderr | default(brave_policy.stderr) | default('')))

    - name: Install Brave browser (official)
      ansible.builtin.apt:
        name: brave-browser
        state: present
      when: "brave_installed.rc != 0 and ('Candidate: (none)' not in brave_policy.stdout)"


    ############################################################
    # Chromium (Flatpak)
    ############################################################

    - name: Install Chromium
      community.general.flatpak:
        name: org.chromium.Chromium
        state: present
        remote: flathub

    ############################################################
    # Microsoft Edge
    ############################################################

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - curl
        state: present

    - name: Download Microsoft GPG key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /usr/share/keyrings/microsoft.asc
        mode: '0644'

    - name: Convert Microsoft GPG key to keyring
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /usr/share/keyrings/microsoft-edge-archive-keyring.gpg /usr/share/keyrings/microsoft.asc
      args:
        creates: /usr/share/keyrings/microsoft-edge-archive-keyring.gpg

    - name: Ensure Microsoft keyring is readable
      ansible.builtin.file:
        path: /usr/share/keyrings/microsoft-edge-archive-keyring.gpg
        mode: '0644'

    - name: Add Microsoft Edge repository
      ansible.builtin.apt_repository:
        repo: 'deb [signed-by=/usr/share/keyrings/microsoft-edge-archive-keyring.gpg] https://packages.microsoft.com/repos/edge stable main'
        state: present
        update_cache: yes

    - name: Install Microsoft Edge
      ansible.builtin.apt:
        name: microsoft-edge-stable
        state: present


    ############################################################
    # Responsively App
    ############################################################

    - name: Install curl
      ansible.builtin.apt:
        name: curl
        state: present

    - name: Download latest Responsively AppImage
      ansible.builtin.shell: |
        API_URL="https://api.github.com/repos/responsively-org/responsively-app-releases/releases/latest"
        ASSET_URL=$(curl -s $API_URL | grep -Po 'https://[^\"]*ResponsivelyApp[^\"]*AppImage' | head -1)
        if [ -z "$ASSET_URL" ]; then
          ASSET_URL="https://github.com/responsively-org/responsively-app-releases/releases/download/v1.15.0/ResponsivelyApp-1.15.0.AppImage"
        fi
        curl -sL "$ASSET_URL" -o /usr/local/bin/ResponsivelyApp.AppImage
        chmod 0755 /usr/local/bin/ResponsivelyApp.AppImage
      args:
        executable: /bin/bash

    - name: Download Responsively icon
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/responsively-org/responsively-app/refs/heads/main/desktop-app/assets/icons/256x256.png
        dest: /usr/share/icons/responsively.png
        mode: '0644'

    - name: Create Desktop Entry for Responsively
      ansible.builtin.copy:
        content: |
          [Desktop Entry]
          Name=ResponsivelyApp
          Exec=/usr/local/bin/ResponsivelyApp.AppImage
          Icon=/usr/share/icons/responsively.png
          Type=Application
          Categories=Development;
          Terminal=false
        dest: /usr/share/applications/responsively.desktop
        mode: '0644'


    ############################################################
    # Tor Browser (Flatpak)
    ############################################################

    - name: Install Tor Browser Launcher
      community.general.flatpak:
        name: org.torproject.torbrowser-launcher
        state: present
        remote: flathub

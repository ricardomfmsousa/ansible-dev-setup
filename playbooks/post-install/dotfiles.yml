---
- name: Copy dotfiles to home directory
  hosts: all
  tasks:
    # Copy all configuration files under the dotfiles folder
    - name: Copy dotfiles
      ansible.builtin.copy:
        src: ../../config/dotfiles/
        dest: '{{ ansible_env.HOME }}/'
        owner: '{{ ansible_user_id }}'
        group: '{{ ansible_user_id }}'
        mode: '0644'

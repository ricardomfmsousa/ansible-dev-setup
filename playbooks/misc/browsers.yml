- hosts: all
  become: yes
  tasks:
    # Google Chrome
    - name: Download Google signing key
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /usr/share/keyrings/google-linux-signing-keyring.asc
        mode: '0644'

    - name: Convert Google signing key to keyring
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /usr/share/keyrings/google-linux-signing-keyring.gpg /usr/share/keyrings/google-linux-signing-keyring.asc
      args:
        creates: /usr/share/keyrings/google-linux-signing-keyring.gpg

    - name: Stat Google keyring
      ansible.builtin.stat:
        path: /usr/share/keyrings/google-linux-signing-keyring.gpg
      register: google_keyring

    - name: Ensure Google keyring is readable
      ansible.builtin.file:
        path: /usr/share/keyrings/google-linux-signing-keyring.gpg
        mode: '0644'
      when: google_keyring.stat.exists

    - name: Add Google Chrome APT repository
      ansible.builtin.apt_repository:
        repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux-signing-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main'
        state: present

    - name: Install Google Chrome package
      ansible.builtin.apt:
        name: google-chrome-stable
        state: present
        update_cache: yes

    # Brave Browser
    - name: Download Brave browser GPG key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-core.asc
        dest: /usr/share/keyrings/brave-core.asc
        mode: '0644'

    - name: Convert Brave key to dearmored keyring
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /usr/share/keyrings/brave-browser-archive-keyring.gpg /usr/share/keyrings/brave-core.asc
      args:
        creates: /usr/share/keyrings/brave-browser-archive-keyring.gpg

    - name: Stat Brave keyring
      ansible.builtin.stat:
        path: /usr/share/keyrings/brave-browser-archive-keyring.gpg
      register: brave_keyring

    - name: Ensure Brave keyring is readable
      ansible.builtin.file:
        path: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: '0644'
      when: brave_keyring.stat.exists

    - name: Add Brave browser APT source (signed-by keyring)
      ansible.builtin.apt_repository:
        repo: 'deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main'
        state: present

    - name: Install Brave browser
      ansible.builtin.apt:
        name: brave-browser
        state: present
        update_cache: yes

    # Chromium
    - name: Install Chromium
      community.general.flatpak:
        name: org.chromium.Chromium
        state: present
        remote: flathub

    # Opera
    - name: Download Opera browser GPG key
      ansible.builtin.get_url:
        url: https://deb.opera.com/archive.key
        dest: /usr/share/keyrings/opera-archive.key
        mode: '0644'

    - name: Convert Opera key to dearmored keyring
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /usr/share/keyrings/opera-archive-keyring.gpg /usr/share/keyrings/opera-archive.key
      args:
        creates: /usr/share/keyrings/opera-archive-keyring.gpg

    - name: Stat Opera keyring
      ansible.builtin.stat:
        path: /usr/share/keyrings/opera-archive-keyring.gpg
      register: opera_keyring

    - name: Ensure Opera keyring is readable
      ansible.builtin.file:
        path: /usr/share/keyrings/opera-archive-keyring.gpg
        mode: '0644'
      when: opera_keyring.stat.exists

    - name: Add Opera browser APT source (signed-by keyring)
      ansible.builtin.apt_repository:
        repo: 'deb [signed-by=/usr/share/keyrings/opera-archive-keyring.gpg arch=amd64] https://deb.opera.com/opera-stable/ stable non-free'
        state: present

    - name: Install Opera browser
      ansible.builtin.apt:
        name: opera-stable
        state: present
        update_cache: yes

    # Microsoft Edge
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - curl
        state: present

    - name: Download Microsoft GPG key (ascii) to temp file
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /usr/share/keyrings/microsoft.asc
        mode: '0644'

    - name: Convert Microsoft GPG key to keyring (dearmor)
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /usr/share/keyrings/microsoft-edge-archive-keyring.gpg /usr/share/keyrings/microsoft.asc
      args:
        creates: /usr/share/keyrings/microsoft-edge-archive-keyring.gpg

    - name: Stat Microsoft keyring
      ansible.builtin.stat:
        path: /usr/share/keyrings/microsoft-edge-archive-keyring.gpg
      register: microsoft_keyring

    - name: Ensure keyring is readable
      ansible.builtin.file:
        path: /usr/share/keyrings/microsoft-edge-archive-keyring.gpg
        mode: '0644'
      when: microsoft_keyring.stat.exists

    - name: Add Microsoft Edge repository
      ansible.builtin.apt_repository:
        repo: 'deb [signed-by=/usr/share/keyrings/microsoft-edge-archive-keyring.gpg] https://packages.microsoft.com/repos/edge stable main'
        state: present

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Microsoft Edge
      ansible.builtin.apt:
        name: microsoft-edge-stable
        state: present

    # Responsively App
    - name: Install dependencies
      ansible.builtin.apt:
        name: curl
        state: present

    - name: Download latest Responsively AppImage
      ansible.builtin.shell: |
        # Get latest release asset URL from GitHub API and download the AppImage
        API_URL="https://api.github.com/repos/responsively-org/responsively-app-releases/releases/latest"
        ASSET_URL=$(curl -s $API_URL | grep -Po 'https://[^\"]*ResponsivelyApp[^\"]*AppImage' | head -1)
        if [ -z "$ASSET_URL" ]; then
          echo "Could not find Responsively AppImage latest release; falling back to bundled URL"
          ASSET_URL="https://github.com/responsively-org/responsively-app-releases/releases/download/v1.15.0/ResponsivelyApp-1.15.0.AppImage"
        fi
        curl -sL "$ASSET_URL" -o /usr/local/bin/ResponsivelyApp.AppImage
        chmod 0755 /usr/local/bin/ResponsivelyApp.AppImage
      args:
        executable: /bin/bash

    - name: Download Responsively icon
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/responsively-org/responsively-app/refs/heads/main/desktop-app/assets/icons/256x256.png
        dest: /usr/share/icons/responsively.png
        mode: '0644'

    - name: Create Desktop Entry for Responsively
      ansible.builtin.copy:
        content: |
          [Desktop Entry]
          Name=ResponsivelyApp
          Exec=/usr/local/bin/ResponsivelyApp.AppImage
          Icon=/usr/share/icons/responsively.png
          Type=Application
          Categories=Development;
          Terminal=false
        dest: /usr/share/applications/responsively.desktop
        mode: '0644'

    # Tor Browser
    - name: Install Tor Browser Launcher
      community.general.flatpak:
        name: org.torproject.torbrowser-launcher
        state: present
        remote: flathub

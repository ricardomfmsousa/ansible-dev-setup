---
- name: Install all development playbooks and dependencies
  hosts: all
  tasks:
    - name: Install native packages (core)
      ansible.builtin.apt:
        pkg:
          - vim
        state: present
      become: true

    - name: Download Microsoft GPG key (official instructions)
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /tmp/packages.microsoft.asc
        mode: '0644'
      become: true

    - name: Convert Microsoft GPG key to keyring (official instructions)
      ansible.builtin.shell: |
        gpg --dearmor /tmp/packages.microsoft.asc > /usr/share/keyrings/microsoft.gpg
      args:
        creates: /usr/share/keyrings/microsoft.gpg
      become: true

    - name: Ensure VSCode keyring permissions
      ansible.builtin.file:
        path: /usr/share/keyrings/microsoft.gpg
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Add VSCode APT repository (official instructions)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/vscode.list
        content: "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main\n"
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Update apt cache for VSCode repo
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      become: true

    - name: Install Visual Studio Code (official)
      ansible.builtin.apt:
        name: code
        state: present
      become: true

    - name: Install JetBrains Toolbox - manage all available JetBrains software
      ansible.builtin.shell: |
        . /tmp/lib/misc.sh
        TOOLBOX_URL=$(curl --silent 'https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release' \
            -H 'Origin: https://www.jetbrains.com' \
            -H 'Accept-Encoding: gzip, deflate, br' \
            -H 'Accept-Language: en-US,en;q=0.8' \
            -H 'Accept: application/json, text/javascript, */*; q=0.01' \
            -H 'Referer: https://www.jetbrains.com/toolbox/download/' \
            -H 'Connection: keep-alive' \
            -H 'DNT: 1' \
            --compressed \
          | grep -Po '\"linux\":.*?[^\\]\\\",\\\"' \
          | awk -F ':' '{print $3,":"$4}' | sed 's/[\\\", ]//g')
        APP_IMAGE_FOLDER="$HOME/.local/bin"
        install -d "$APP_IMAGE_FOLDER"
        rm -rf "$APP_IMAGE_FOLDER/jetbrains-toolbox"
        curl -sL "$TOOLBOX_URL" | tar xvz --directory="$APP_IMAGE_FOLDER" --strip-components=1
        create-launcher-script $APP_IMAGE_FOLDER/jetbrains-toolbox $APP_IMAGE_FOLDER/jetbrains-toolbox.sh
        add-to-startup jetbrains-toolbox $APP_IMAGE_FOLDER/jetbrains-toolbox.sh
      args:
        executable: /bin/bash

    - name: Set VSCode as default text editor
      ansible.builtin.shell: xdg-mime default code.desktop text/plain
      args:
        executable: /bin/bash
      changed_when: false

    - name: Restore VSCode settings
      ansible.builtin.copy:
        src: ../../config/misc/vs-code-settings.json
        dest: '{{ ansible_env.HOME }}/.config/Code/User/settings.json'
        owner: '{{ ansible_user_id }}'
        group: '{{ ansible_user_id }}'
        mode: '0644'

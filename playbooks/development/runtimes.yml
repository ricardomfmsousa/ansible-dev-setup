---
- name: Install and configure Java, Node.js, Go, and PHP runtimes
  hosts: all
  tasks:
    # Install asdf
    - name: Install dependencies for asdf and plugins
      ansible.builtin.apt:
        name:
          - curl # Command-line tool for transferring data
          - git # Version control system
          - zsh # Extended Bourne shell with many improvements
          - locate # Command to find files by name
          - unzip # Utility to extract compressed files
          - autoconf # Tool for generating configuration scripts
          - bison # Parser generator
          - build-essential # Informational list of build-essential packages
          - libssl-dev # SSL development libraries
          - libyaml-dev # YAML development libraries
          - libreadline-dev # GNU readline development libraries
          - zlib1g-dev # Compression library
          - libncurses5-dev # Developer's libraries for ncurses
          - libffi-dev # Foreign Function Interface library
          - libgdbm-dev # GNU dbm development libraries
          - re2c # Lexical analyzer generator
          - sqlite3
        state: present
      become: true

    - name: Clone asdf repository (track main for latest)
      ansible.builtin.git:
        repo: 'https://github.com/asdf-vm/asdf.git'
        dest: '{{ ansible_env.HOME }}/.asdf'
        version: main
        update: yes

    - name: Refresh shell to load asdf
      ansible.builtin.shell: |
        echo '. "$HOME/.asdf/asdf.sh"' >> '{{ ansible_env.HOME }}/.zshrc'
        . '{{ ansible_env.HOME }}/.zshrc'
      args:
        executable: /bin/zsh
      changed_when: false

    # Java
    - name: Ensure system default JDK is available (recommended fallback)
      ansible.builtin.apt:
        name:
          - default-jdk
        state: present
      become: true

    - name: 'NOTE: asdf Java plugin install (manual verification required)'
      ansible.builtin.debug:
        msg: "The previous playbook used a pinned AdoptOpenJDK version via asdf. For Pop!_OS 24.04 we recommend using 'default-jdk' (installed above) or updating the asdf/java plugin usage to an appropriate temurin/adopt version. Leave asdf-based Java installs to manual verification."

    - name: 'NOTE: Spring CLI install requires manual check (left as-is)'
      ansible.builtin.debug:
        msg: 'Spring CLI is installed by downloading from repo.spring.io in the older playbook. Consider using SDKMAN or verify the download URL for the latest Spring CLI on Pop!_OS 24.04.'

    # Node.js
    - name: Add asdf nodejs plugin, install and set latest Node.js version
      ansible.builtin.shell: |
        . '{{ ansible_env.HOME }}/.asdf/asdf.sh'
        asdf plugin-add nodejs https://github.com/asdf-vm/asdf-nodejs.git || true
        asdf install nodejs latest || true
        asdf global nodejs latest || true
        # Install global Node.js packages
        npm install -g yarn @angular/cli create-react-app next || true
      args:
        executable: /bin/zsh

    # Go
    - name: Add asdf golang plugin, install and set latest Go version
      ansible.builtin.shell: |
        . '{{ ansible_env.HOME }}/.asdf/asdf.sh'
        asdf plugin-add golang https://github.com/kennyp/asdf-golang.git || true
        asdf install golang latest || true
        asdf global golang latest || true
      args:
        executable: /bin/zsh

    # PHP
    - name: Install php runtime dependencies
      ansible.builtin.apt:
        name:
          - libgd-dev
          - libonig-dev
          - libzip-dev
        state: present
      become: true

    - name: Add asdf php plugin, install and set latest PHP version
      ansible.builtin.shell: |
        . '{{ ansible_env.HOME }}/.asdf/asdf.sh'
        asdf plugin-add php https://github.com/asdf-community/asdf-php.git || true
        asdf install php latest || true
        asdf global php latest || true
      args:
        executable: /bin/zsh

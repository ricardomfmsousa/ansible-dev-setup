---
- name: Install virtualization tools
  hosts: all
  become: true
  tasks:
    # -------------------------
    # VirtualBox
    # -------------------------
    - name: Set VirtualBox license to true
      ansible.builtin.debconf:
        name: virtualbox-ext-pack
        question: virtualbox-ext-pack/license
        value: 'true'
        vtype: select

    - name: Install VirtualBox core packages
      ansible.builtin.apt:
        pkg:
          - virtualbox
          - virtualbox-dkms
          - virtualbox-guest-additions-iso
          - virtualbox-guest-utils
        state: present
        update_cache: true

    - name: Check if virtualbox-ext-pack is available
      ansible.builtin.shell: 'apt-cache policy virtualbox-ext-pack | grep Candidate || true'
      register: vbox_ext_check
      changed_when: false

    - name: Install VirtualBox Extension Pack
      ansible.builtin.apt:
        name: virtualbox-ext-pack
        state: present
      when: vbox_ext_check.stdout != ""
      failed_when: false

    # -------------------------
    # Docker (via official script)
    # -------------------------
    - name: Check if Docker is already installed
      ansible.builtin.shell: command -v docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install Docker using official script
      ansible.builtin.shell: |
        curl -fsSL https://get.docker.com | sh
      when: docker_check.rc != 0

    - name: Ensure docker group exists (before adding user)
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add current user to Docker group
      ansible.builtin.user:
        name: '{{ ansible_user_id }}'
        groups: docker
        append: yes

    - name: Fix permissions for Docker socket
      ansible.builtin.file:
        path: /var/run/docker.sock
        mode: '0666'
        state: file
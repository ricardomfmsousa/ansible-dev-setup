---
- name: Install database tools
  hosts: all
  become: true
  tasks:
    ############################################################
    # DBeaver
    ############################################################
    - name: Install DBeaver
      community.general.flatpak:
        name: io.dbeaver.DBeaverCommunity
        state: present
        remote: flathub

    ############################################################
    # MongoDB Compass
    ############################################################
    - name: Install MongoDB Compass
      community.general.flatpak:
        name: com.mongodb.Compass
        state: present
        remote: flathub
      register: compass_install
      retries: 5
      delay: 30
      until: compass_install is succeeded
